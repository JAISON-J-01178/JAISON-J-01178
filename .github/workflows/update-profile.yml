name: Update Live GitHub Profile

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Target Profile Repository
        uses: actions/checkout@v4

      - name: Fetch Dynamic Profile README from Profile Studio Engine
        run: |
          echo "Fetching latest dynamic profile README for JAISON-J-01178..."
          curl -s "https://jaison-j-01178-github-readme-genera.vercel.app/api/readme?username=JAISON-J-01178" -o README.md

      - name: Commit and Push Changes If Modified
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update live profile"
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
          commit_author: "github-actions[bot] <github-actions[bot]@users.noreply.github.com>"
          skip_dirty_check: false
